<!DOCTYPE html>
<html>
<head>
    <title>ZYP - Data Plotter</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: black;
            justify-content: flex-start; /* Changed from center to flex-start */
        }
        .centered-content {
            width: 60%;
            min-width: 800px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 80px auto; /* Centered horizontally and added top margin */
            flex: 1; /* Ensure it grows to fill space */
            overflow-y: auto;
            position: relative;
            z-index: 2;
        }
        .star {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 5px white;
            animation: shine 1s infinite ease-in-out alternate;
        }
        @keyframes shine {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .button-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 3;
        }
        .w3-button {
            margin: 0 4px;
            background-color: white;
            color: black;
        }
        .footer-container {
            width: 100%;
            padding: 10px;
            text-align: left;
            position: relative;
            z-index: 3;
            color: white;
            margin-top: auto; /* Push footer to the bottom */
        }
        .color-link {
            color: #8a93ff;
            text-decoration: none;
        }
        .color-link:hover {
            color: #98ffb1;
        }
				input[type=range] {
            width: 300px; /* Adjust the width as needed */
        }
    </style>
		<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="button-container">
        <a href="/" class="w3-button w3-round">Home</a>
        <a href="https://www.ornl.gov/staff-profile/yuanpeng-zhang" target="_blank" class="w3-button w3-round">Yuanpeng's Profile</a>
        <a href="https://me.iris-home.net" target="_blank" class="w3-button w3-round">Homepage</a>
        <a href="https://iris2020.net" target="_blank" class="w3-button w3-round">Blog</a>
        <button onclick="toggleBackground()" class="w3-button w3-round">Dark/Light</button>
    </div>

    <div class="centered-content">
        <a href="/" class="w3-button" id="return_button" style="margin-left:17px;background:#7e98ec;color:white">Return</a>
        <div class="w3-card-4 w3-margin">
            <div class="w3-container w3-padding">
                <h1 class="w3-center">{{ fn }}</h1>
                <div id="plot"></div>
								<!-- Sliders for Dataset 1 -->
								<div>
										<label>Dataset-1 Y-Scale: <input type="range" id="scale1" min="{{ trans_params[1] }}" max="{{ trans_params[0] }}" step="{{ (trans_params[0] - trans_params[1]) / 100 }}" value="1"></label>
    						    <label>Y-Offset: <input type="range" id="yOffset1" min="{{ trans_params[3] }}" max="{{ trans_params[2] }}" step="{{ (trans_params[2] - trans_params[3]) / 100 }}" value="0"></label>
    						    <label>X-Offset: <input type="range" id="xOffset1" min="{{ -trans_params[4] * 20 }}" max="{{ trans_params[4] * 20}}" step="{{ trans_params[4] }}" value="0"></label>
    						</div>

    						<!-- Sliders for Dataset 2 -->
    						<div>
										<label>Dataset-2 Y-Scale: <input type="range" id="scale2" min="{{ trans_params[1] }}" max="{{ trans_params[0] }}" step="{{ (trans_params[0] - trans_params[1]) / 100 }}" value="1"></label>
    						    <label>Y-Offset: <input type="range" id="yOffset2" min="{{ trans_params[3] }}" max="{{ trans_params[2] }}" step="{{ (trans_params[2] - trans_params[3]) / 100 }}" value="0"></label>
    						    <label>X-Offset: <input type="range" id="xOffset2" min="{{ -trans_params[5] * 20 }}" max="{{ trans_params[5] * 20}}" step="{{ trans_params[5] }}" value="0"></label>
    						</div>

								<br />

								<button class="w3-button" id="resetButton">Reset All Sliders</button>
            </div>
        </div>
        <p>
            <a style="color: red"><b>N.B.</b> The uploaded data will be deleted after plotting.</a>
            <br>
            <a style="color: red"><b>N.B.</b> Refreshing current page will lead us back to the index page.</a>
        </p>
    </div>

    <div class="footer-container">
        <a id="copyright">Copyright &copy; 2025 Yuanpeng Zhang</a> <a id="sep1">|</a> <a class="color-link" href="https://www.ornl.gov/" target="_blank">ORNL</a> <a id="sep2">|</a> <a class="color-link" href="https://github.com/Kvieta1990/simple_plotter" target="_blank">Project GitHub Repo</a> <a id="sep3">|</a> <a class="color-link" href="https://iris2020.net/contact" target="_blank">Contact Me</a>
    </div>

    <script>
        function createStars(count) {
            const sky = document.querySelector('body');
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.top = `${Math.random() * window.innerHeight}px`;
                star.style.left = `${Math.random() * window.innerWidth}px`;
                star.style.animationDuration = `${Math.random() * 3 + 1}s`; // Random duration between 1s and 4s
                star.style.animationDelay = `${Math.random() * 3}s`; // Random delay
                sky.appendChild(star);
            }
        }

        function toggleBackground() {
            const body = document.querySelector('body');
            const buttons = document.querySelectorAll('.w3-button');
            const stars = document.querySelectorAll('.star');
            const copyright = document.getElementById('copyright');
            const sep1 = document.getElementById('sep1');
            const sep2 = document.getElementById('sep2');
            const sep3 = document.getElementById('sep3');

            // Check current theme
            let currentTheme = localStorage.getItem('theme') || 'light'; // Default to 'light' if no theme is set

            if (currentTheme === 'light') {
                // Switch to dark theme
                body.style.background = 'black';
                buttons.forEach(button => {
                    button.style.backgroundColor = 'white';
                    button.style.color = 'black';
                    copyright.style.color = 'white';
                    sep1.style.color = 'white';
                    sep2.style.color = 'white';
                    sep3.style.color = 'white';
                });
                document.getElementById('return_button').style.backgroundColor = '#7e98ec';
                document.getElementById('return_button').style.color = 'white';
                stars.forEach(star => {
                    star.style.backgroundColor = 'white';
                });
                // Update localStorage
                localStorage.setItem('theme', 'dark');
            } else {
                // Switch to light theme
                body.style.background = 'white';
                buttons.forEach(button => {
                    button.style.backgroundColor = '#7e98ec';
                    button.style.color = 'white';
                    copyright.style.color = 'black';
                    sep1.style.color = 'black';
                    sep2.style.color = 'black';
                    sep3.style.color = 'black';
                });
                stars.forEach(star => {
                    star.style.backgroundColor = 'white';
                });
                // Update localStorage
                localStorage.setItem('theme', 'light');
            }
        }

        function setTheme(theme) {
            const body = document.querySelector('body');
            const buttons = document.querySelectorAll('.w3-button');
            const stars = document.querySelectorAll('.star');
            const copyright = document.getElementById('copyright');
            const sep1 = document.getElementById('sep1');
            const sep2 = document.getElementById('sep2');
            const sep3 = document.getElementById('sep3');

            if (theme === 'dark') {
                // Switch to dark theme
                body.style.background = 'black';
                buttons.forEach(button => {
                    button.style.backgroundColor = 'white';
                    button.style.color = 'black';
                    copyright.style.color = 'white';
                    sep1.style.color = 'white';
                    sep2.style.color = 'white';
                    sep3.style.color = 'white';
                });
                document.getElementById('return_button').style.backgroundColor = '#7e98ec';
                document.getElementById('return_button').style.color = 'white';
                stars.forEach(star => {
                    star.style.backgroundColor = 'white';
                });
            } else {
                body.style.background = 'white';
                buttons.forEach(button => {
                    button.style.backgroundColor = '#7e98ec';
                    button.style.color = 'white';
                    copyright.style.color = 'black';
                    sep1.style.color = 'black';
                    sep2.style.color = 'black';
                    sep3.style.color = 'black';
                });
                stars.forEach(star => {
                    star.style.backgroundColor = 'white';
                });
            }
        }

        window.onload = () => {
            createStars(150); // Create 150 stars
            let currentTheme = localStorage.getItem('theme') || 'light';
            setTheme(currentTheme);
        };

				var graphs = {{ graphJSON|safe }};
        var initialX1 = {{ initial_x1|safe }};
        var initialX2 = {{ initial_x2|safe }};
        var initialY1 = {{ initial_y1|safe }};
        var initialY2 = {{ initial_y2|safe }};

        Plotly.newPlot('plot', graphs.data, graphs.layout);

        function updatePlot() {
            var scale1 = parseFloat($('#scale1').val());
            var yOffset1 = parseFloat($('#yOffset1').val());
            var xOffset1 = parseFloat($('#xOffset1').val());
            
            var scale2 = parseFloat($('#scale2').val());
            var yOffset2 = parseFloat($('#yOffset2').val());
            var xOffset2 = parseFloat($('#xOffset2').val());

            var update1 = {
                'x': [initialX1.map(x => x + xOffset1)],
                'y': [initialY1.map(y => y * scale1 + yOffset1)]
            };
            
            var update2 = {
                'x': [initialX2.map(x => x + xOffset2)],
                'y': [initialY2.map(y => y * scale2 + yOffset2)]
            };
            
            Plotly.update('plot', update1, {}, [0]);
            Plotly.update('plot', update2, {}, [1]);
        }

				function resetSliders() {
            $('#scale1').val(1);
            $('#yOffset1').val(0);
            $('#xOffset1').val(0);
            $('#scale2').val(1);
            $('#yOffset2').val(0);
            $('#xOffset2').val(0);

						var trace1Name = graphs.data[0].name;
            var trace2Name = graphs.data[1].name;

            // Reset plot to initial data
            Plotly.newPlot('plot', [
                {x: initialX1, y: initialY1, mode: 'lines', name: trace1Name},
                {x: initialX2, y: initialY2, mode: 'lines', name: trace2Name}
            ], graphs.layout);
        }
        
        $('input[type=range]').on('input', updatePlot);
				$('#resetButton').on('click', resetSliders);
    </script>

    <script defer src="https://umm.iris-home.net/script.js" data-website-id="e327d37b-ab6d-4807-a019-32d2be42c28e"></script>

</body>
</html>
